<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <title>Maintenance Garage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="header">
            <h1 class="header-title">🚗 Maintenance Garage</h1>
        </header>

        <main>
            <section id="home-screen" class="screen active">
                <div class="card">
                    <div class="card-title">現在走行距離</div>
                    <div class="metric-box">
                        <span class="big-value" id="home-current-distance">0 km</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">最新燃費</div>
                    <div class="metric-box">
                        <span class="big-value" id="home-latest-fuel">未記録</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">集計</div>
                    <div class="summary-grid">
                        <div class="mini-stat">
                            <span class="label">給油件数</span>
                            <span class="value" id="home-fuel-count">0 件</span>
                        </div>
                        <div class="mini-stat">
                            <span class="label">整備件数</span>
                            <span class="value" id="home-maintenance-count">0 件</span>
                        </div>
                    </div>
                </div>
            </section>

            <section id="fuel-screen" class="screen">
                <div class="card">
                    <div class="card-title">⛽ 給油記録</div>

                    <form id="fuel-form">
                        <div id="fuel-form-alert" class="alert success" hidden></div>

                        <div class="form-group">
                            <label for="fuel-date">日付</label>
                            <input id="fuel-date" name="date" type="date" required>
                        </div>

                        <div class="form-group">
                            <label for="fuel-odometer">オドメーター(km)</label>
                            <input id="fuel-odometer" name="odometer" type="number" min="0" step="1" placeholder="125000" required>
                        </div>

                        <div class="form-group">
                            <label for="fuel-amount">給油量(L)</label>
                            <input id="fuel-amount" name="fuelAmount" type="number" min="0" step="0.1" placeholder="42.3" required>
                        </div>

                        <div class="form-group">
                            <label for="fuel-price">金額(円)</label>
                            <input id="fuel-price" name="price" type="number" min="0" step="1" placeholder="7100" required>
                        </div>

                        <div class="inline-actions">
                            <button type="submit" class="primary-btn">保存</button>
                            <button type="button" id="cancel-fuel-edit-btn" class="secondary-btn" hidden>キャンセル</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="maintenance-screen" class="screen">
                <div class="card">
                    <div class="card-title">🔧 整備記録</div>

                    <form id="maintenance-form">
                        <div id="maintenance-form-alert" class="alert success" hidden></div>

                        <div class="form-group">
                            <label for="part-name-select">部品名</label>
                            <select id="part-name-select" name="partName"></select>
                        </div>

                        <div class="form-group">
                            <label for="new-part-name">部品追加</label>
                            <div class="inline-actions">
                                <input id="new-part-name" type="text" placeholder="例: ブレーキパッド">
                                <button type="button" id="add-part-btn" class="secondary-btn">追加</button>
                            </div>
                            <div id="part-add-alert" class="alert success" hidden></div>
                        </div>

                        <div class="form-group">
                            <label for="maintenance-date">交換日</label>
                            <input id="maintenance-date" name="date" type="date" required>
                        </div>

                        <div class="form-group">
                            <label for="maintenance-odometer">交換時走行距離(km)</label>
                            <input id="maintenance-odometer" name="odometer" type="number" min="0" step="1" placeholder="125000" required>
                        </div>

                        <div class="form-group">
                            <label for="maintenance-cost">費用(円)</label>
                            <input id="maintenance-cost" name="cost" type="number" min="0" step="1" placeholder="12000" required>
                        </div>

                        <div class="form-group">
                            <label for="maintenance-memo">メモ</label>
                            <textarea id="maintenance-memo" name="memo" placeholder="交換内容や注意点をメモできます"></textarea>
                        </div>

                        <div class="inline-actions">
                            <button type="submit" class="success-btn">保存</button>
                            <button type="button" id="cancel-maintenance-edit-btn" class="secondary-btn" hidden>キャンセル</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="history-screen" class="screen">
                <div class="history-subnav" aria-label="履歴カテゴリ">
                    <button type="button" class="history-subtab active" data-history-tab="fuel">給油</button>
                    <button type="button" class="history-subtab" data-history-tab="maintenance">整備</button>
                    <button type="button" class="history-subtab" data-history-tab="delete">削除</button>
                    <button type="button" class="history-subtab" data-history-tab="manage">管理</button>
                </div>

                <div class="history-panel" data-history-panel="fuel">
                    <div class="card">
                        <div class="card-title">📋 給油履歴</div>
                        <div class="history-toolbar">
                            <select id="fuel-year-filter" class="compact-select">
                                <option value="all">全期間</option>
                            </select>
                            <select id="fuel-month-filter" class="compact-select">
                                <option value="all">全月</option>
                            </select>
                        </div>
                        <div class="inline-actions history-actions">
                            <button type="button" id="export-fuel-csv-btn" class="secondary-btn">給油CSV出力</button>
                        </div>
                        <div id="fuel-history-list" class="history-list"></div>
                    </div>
                </div>

                <div class="history-panel" data-history-panel="maintenance">
                    <div class="card">
                        <div class="card-title">🛠 整備履歴</div>
                        <div class="history-toolbar">
                            <select id="maintenance-year-filter" class="compact-select">
                                <option value="all">全期間</option>
                            </select>
                            <select id="maintenance-month-filter" class="compact-select">
                                <option value="all">全月</option>
                            </select>
                        </div>
                        <div class="inline-actions history-actions">
                            <button type="button" id="export-maintenance-csv-btn" class="secondary-btn">整備CSV出力</button>
                        </div>
                        <div id="maintenance-history-list" class="maintenance-list"></div>
                    </div>
                </div>

                <div class="history-panel" data-history-panel="delete">
                    <div class="card">
                        <div class="card-title">🗑 削除履歴</div>
                        <div id="delete-history-list" class="history-list"></div>
                    </div>
                </div>

                <div class="history-panel" data-history-panel="manage">
                    <div class="card">
                        <div class="card-title">📤 インポート</div>
                        <div class="inline-actions history-actions">
                            <button type="button" id="import-csv-btn" class="secondary-btn">CSVインポート</button>
                        </div>
                        <input id="import-csv-input" type="file" accept=".csv,text/csv" hidden>
                        <div id="import-status" class="alert success" hidden></div>
                    </div>

                    <div class="card">
                        <div class="card-title">🧹 データ管理</div>
                        <button type="button" id="clear-all-data-btn" class="danger-btn">全データをクリア</button>
                    </div>
                </div>
            </section>
        </main>

        <div id="delete-confirm-modal" class="modal hidden" aria-modal="true" role="dialog">
            <div class="modal-card">
                <div class="modal-title">削除確認</div>
                <p id="delete-confirm-message">このデータを削除しますか？</p>
                <div class="inline-actions">
                    <button type="button" id="confirm-delete-btn" class="danger-btn">削除</button>
                    <button type="button" id="cancel-delete-btn" class="secondary-btn">キャンセル</button>
                </div>
            </div>
        </div>

        <nav class="nav" aria-label="メニュー">
            <button class="nav-button active" data-screen="home" type="button">
                <span class="icon">🏠</span>
                <span>ホーム</span>
            </button>
            <button class="nav-button" data-screen="fuel" type="button">
                <span class="icon">⛽</span>
                <span>給油</span>
            </button>
            <button class="nav-button" data-screen="maintenance" type="button">
                <span class="icon">🔧</span>
                <span>整備</span>
            </button>
            <button class="nav-button" data-screen="history" type="button">
                <span class="icon">📋</span>
                <span>履歴</span>
            </button>
        </nav>
    </div>

    <script defer src="constants.js"></script>
    <script defer src="utils.js"></script>
    <script defer src="storage.js"></script>
    <script defer src="ui.js"></script>
    <script defer src="fuel.js"></script>
    <script defer src="maintenance.js"></script>
    <script defer src="history.js"></script>
    <script defer src="app.js"></script>
</body>
</html>
